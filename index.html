<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusDirect</title>
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-600 p-8">

<!-- HEADER with flex -->
<header class="bg-white p-5 mb-4 rounded-lg flex items-center justify-between">
  <div class="flex items-center space-x-3">
    <img src="/photos/bus-logo-abstract_7315-17 (1).avif" alt="BusDirect Logo" class="h-8 w-auto">
      
            
    <!-- word Busdirect f header -->
     
      <h1 class="text-xl font-bold text-blue-900">BusDirect - Liste des Trajets</h1>
    </div>
  
</header> 
<main>




  <section class="bg-white p-5 mb-4 rounded-lg w-full flex items-center justify- gap-4">
  <div class ="bg-blue-200 p-4 rounded-lg flex-1 text-center">
<p class = "text-xs font-bold text-blue-700">Total recettes</p>

 <p id ="totalRecette" class ="text-2xl font-extrabold text-gray">8000 DH</p>   
 <P class =" text-xs text-blue-600">Ce mois-ci</P>   
</div>



<!--  Trajets Totales 2eme carte-->
  <div class ="bg-blue-200 p-4 rounded-lg flex-1 text-center">
    <p class ="text-xs font-bold text-blue-700">Trajets totales</p>
 <p id="totalTrajets" class ="text-2xl font-extrabold text-gray ">12</p>   
 <P class =" text-xs text-blue-600">Trajets actifs</P>   
</div>


<!-- passagers 3eme care -->
 <div class ="bg-blue-200 p-4 rounded-lg flex-1 text-center">
    <p class ="text-xs font-bold text-blue-700">Passagers</p>
 <p id = "totalPassagers" class ="text-2xl font-extrabold text-gray ">140</p>   
 <P class =" text-xs text-blue-600">Reseau</P>
 </div>


 <!-- en attente 4eme carte  -->
<div class ="bg-blue-200 p-4 rounded-lg flex-1 text-center">
    <p class ="text-xs font-bold text-blue-700">En attente</p>
 <p id ="totalAttente" class ="text-2xl font-extrabold text-gray">5</p>   
 <P class =" text-xs text-blue-600">Liste d'attente</P>   
</div>
</section>




<!-- section search -->
<section class =" rounded-xl mb-3 flex gap-4">
<!-- city search -->
 <div class = "bg-blue-200 p-4 rounded-lg flex-3 flex items-center gap-2">
  <label class = "font-bold text-sm">Ville:</label>
  <input type ="text" id="search-input" placeholder="Rechercher une ville.." class="w-full p-1 rounded">

 </div>

 <!-- Trajet statut search -->
  <div class ="bg-blue-200 p-3 rounded-lg flex-1 flex items-center">
    <label class ="font-bold text-sm">Statut:</label>
    <select id ="statut-select" class="w-full p-1 rounded">
      <option value="Tous">Tous les trajets</option>
      <option value="Disponible">Disponible</option>
      <option value ="Complet">Complet</option>
    </select>
  </div>
</section>


<!-- 3 columns with grid cars form -->

<section id="listeTrajets" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      </section>
      <nav id="pagination" class="flex justify-center gap-2 mt-6"></nav>
      

    </main>

    <footer class ="text-center text-xs text-white py-2">&copy; 2026 BusDirect</footer>
    <script type="module" src="js/main-trajets.js"></script>
   </body>
